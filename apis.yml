aid: omaze
name: Omaze
description: >-
  Omaze is a for-profit social-impact entertainment company that runs online
  prize draws to raise money for charity. Founded in 2012 in Culver City,
  California by Matthew Pohlson and Ryan Cummins, it lets people enter draws for
  houses, supercars, cash and once-in-a-lifetime experiences, with a share of
  every entry going to a partner nonprofit; the company reports raising more than
  $250 million for over 600 charities and creating 50+ millionaires. Its live
  consumer operations today are the United Kingdom (omaze.co.uk) and Germany
  (omaze.de), both built on Shopify, while omaze.com serves as the corporate and
  brand site. Omaze publishes no developer program, no OpenAPI and no SDKs, but
  both storefronts do expose a genuine machine-readable agent surface: a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a UCP
  Shopping MCP endpoint at /api/ucp/mcp, published agent instructions at
  /llms.txt and /agents.md, anonymous read-only storefront product JSON, and a
  standards-compliant OpenID Connect authorization server for customer accounts.
