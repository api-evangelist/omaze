- aid: omaze:omaze-uk-storefront-json
  name: Omaze UK Storefront JSON
  description: >-
    The anonymous, read-only JSON surface of the Omaze UK storefront, documented
    by Omaze itself in /agents.md for agents that only need to read store data
    without transacting. Covers product listings (/products.json), individual
    products (/products/{handle}.json), collection contents
    (/collections/{handle}/products.json) and the sitemap. No credentials are
    required and no rate limit is published for it; Omaze publishes no OpenAPI
    describing it.
  humanURL: https://omaze.co.uk/agents.md
  baseURL: https://omaze.co.uk
  tags:
  - Product
  - Catalog
  - E-Commerce
  - Read Only
  tags_raw:
