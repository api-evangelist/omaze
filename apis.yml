apis:
- aid: omaze:omaze-uk-ucp-shopping-mcp
  name: Omaze UK UCP Shopping MCP
  description: >-
    The Universal Commerce Protocol Shopping service that Omaze UK exposes over
    the Model Context Protocol, advertised by Omaze in its own /agents.md and
    /llms.txt and described by the merchant profile at /.well-known/ucp. It lets
    an agent search the Omaze UK prize-draw catalog, build a cart, and drive a
    checkout up to the point of buyer-approved payment. Protocol version
    2026-04-08 (2026-01-23 also accepted). The endpoint is live but will not
    negotiate a session until the calling agent presents a resolvable UCP agent
    profile URI, so per-tool input schemas require a profile-bearing
    introspection run.
  humanURL: https://omaze.co.uk/agents.md
  baseURL: https://omaze.co.uk/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - E-Commerce
  - Checkout
  tags_raw:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Ecommerce
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/omaze-mcp.yml
  - type: WellKnown
    url: well-known/omaze-uk-ucp.json
  - type: Authentication
    url: authentication/omaze-authentication.yml
  - type: RateLimits
    url: rate-limits/omaze-rate-limits.yml
  - type: ErrorCatalog
    url: errors/omaze-problem-types.yml
- aid: omaze:omaze-de-ucp-shopping-mcp
  name: Omaze Germany UCP Shopping MCP
  description: >-
    The German-market counterpart of the Omaze UCP Shopping service, exposed over
    MCP at omaze.de/api/ucp/mcp and described by the merchant profile at
    omaze.de/.well-known/ucp. Same protocol version (2026-04-08) and same
    shopping capabilities as the UK store; the payment-handler set differs (Google
    Pay and Shopify card, without Shop Pay). Backed by its own Shopify Customer
    Accounts issuer at accounts.omaze.de.
  humanURL: https://omaze.de/agents.md
  baseURL: https://omaze.de/api/ucp/mcp
