description: >-
  Omaze operates a consumer prize-draw storefront, not a developer platform, and
  publishes no API lifecycle policy of its own. The only versioning it does
  express is protocol-level: the UCP version its merchant profile advertises and
  the older version it still accepts. Everything absent below was probed for and
  not found — none of it is assumed.
versioning:
  scheme: date-based protocol version (Universal Commerce Protocol)
  current: '2026-04-08'
  supported:
    - version: '2026-04-08'
      profile_uk: https://omaze-uk-prod.myshopify.com/.well-known/ucp/2026-04-08
      profile_de_declared: true
      status: latest stable
    - version: '2026-01-23'
      profile_uk: https://omaze-uk-prod.myshopify.com/.well-known/ucp/2026-01-23
      status: still accepted
  mechanism: >-
    Version negotiation via the merchant discovery profile at /.well-known/ucp,
    which publishes both the current version and a map of every supported version
    to its own version-pinned profile document. Capability entries additionally
    carry a `requires.protocol.min` floor (e.g. dev.ucp.shopping.fulfillment and
    dev.ucp.shopping.discount require protocol >= 2026-04-08).
  owner: >-
    The version ladder is defined by the UCP specification and provisioned by
    Shopify. Omaze publishes which versions its storefronts speak; it does not
    author the schedule.
  storefront_json: >-
    The read-only storefront JSON endpoints (/products.json, etc.) carry no
    version identifier and no published versioning policy.
